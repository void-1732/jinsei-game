name: ゲームをGitHub Pagesに公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ゲームの回帰テスト（STEP 46）
        run: npm test
      - name: 公開対象と参照ファイルを検査
        run: node scripts/check-pages.mjs
      - name: 公開用ファイルを作成
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css js _site/
          touch _site/.nojekyll
      - name: Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルを送信
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
